<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal</title>
<meta name="description" content="A daily briefing on experiential marketing, graphic design, brand and content for creative directors.">
<meta name="theme-color" content="#0e0e0f">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="wrap mast-row">
    <div class="mast-left">
      <div class="dateline" id="dateline"></div>
      <h1 class="wordmark">Signal<span class="dot" aria-hidden="true"></span></h1>
      <p class="tagline">Daily intelligence on experiential, design &amp; content</p>
    </div>
    <div class="mast-right">
      <div class="stat" title="Days in a row you've checked in">
        <span class="stat-num" id="streak">1</span><span class="stat-label">day streak</span>
      </div>
      <div class="stat" title="Stories you've opened">
        <span class="stat-num" id="readcount">0</span><span class="stat-label">read</span>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme" title="Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Sections">
  <div class="wrap nav-row">
    <div class="tabs" role="tablist">
      <button class="tab" data-view="today" role="tab">Today</button>
      <button class="tab" data-view="feed" role="tab">Feed</button>
      <button class="tab" data-view="trends" role="tab">Trends</button>
      <button class="tab" data-view="library" role="tab">Level up</button>
      <button class="tab" data-view="saved" role="tab">Saved <span class="badge" id="savedcount"></span></button>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search stories, brands, studios…" autocomplete="off" aria-label="Search">
      <kbd>/</kbd>
    </label>
  </div>
</nav>

<main class="wrap" id="main">
  <section id="view-today" class="view"></section>
  <section id="view-feed" class="view"></section>
  <section id="view-trends" class="view"></section>
  <section id="view-library" class="view"></section>
  <section id="view-saved" class="view"></section>
</main>

<footer class="foot wrap">
  <p id="foot-status"></p>
  <p>Headlines, summaries and images belong to their publishers. Signal links to the original story.</p>
</footer>

<dialog id="peek" aria-label="Story preview"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="library.js"></script>
<script src="app.js"></script>
</body>
</html>
